name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  wordpress-plugin:
    runs-on: ubuntu-latest

    env:
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASS: ''
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_TESTS_SKIP_DB_CREATE: true

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: wordpress

      - name: Install WordPress test suite
        working-directory: wordpress
        run: tests/bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 latest true

      - name: Lint plugin PHP
        working-directory: wordpress
        run: composer run lint:php

      - name: Run PHPUnit
        working-directory: wordpress
        run: composer test
