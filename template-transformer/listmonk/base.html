{{ define "header" }}
<!doctype html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
        <base target="_blank">

        <style>
            @font-face {
                font-family: 'Bangers';
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                mso-font-alt: 'Arial Black';
                src: url('https://newsletter.wirmachen.wien/uploads/assets/fonts/bangers-400.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Roboto';
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                mso-font-alt: 'Arial';
                src: url('https://newsletter.wirmachen.wien/uploads/assets/fonts/roboto-400.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Roboto';
                font-style: normal;
                font-weight: 700;
                font-display: swap;
                mso-font-alt: 'Arial';
                src: url('https://newsletter.wirmachen.wien/uploads/assets/fonts/roboto-700.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Roboto';
                font-style: italic;
                font-weight: 400;
                font-display: swap;
                mso-font-alt: 'Arial';
                src: url('https://newsletter.wirmachen.wien/uploads/assets/fonts/roboto-400-italic.ttf') format('truetype');
            }
            @font-face {
                font-family: 'Roboto';
                font-style: italic;
                font-weight: 700;
                font-display: swap;
                mso-font-alt: 'Arial';
                src: url('https://newsletter.wirmachen.wien/uploads/assets/fonts/roboto-700-italic.ttf') format('truetype');
            }
            body {
                background-color: #00a77e;
                font-family: Roboto, Arial, Helvetica, sans-serif;
                font-size: 20px;
                line-height: 1.45;
                margin: 0;
                color: #140958;
            }

            .wrap {
                background-color: #fff;
                padding: 24px;
                max-width: 552px;
                margin: 0 auto;
            }

            .header {
                background-color: #00a77e;
                padding: 20px;
                text-align: center;
            }

            .header img {
                display: inline-block;
                max-width: 200px;
                width: 200px;
                height: auto;
            }

            h1,
            h2,
            h3 {
                color: #140958;
                font-family: Bangers, Impact, Arial Black, Arial, sans-serif;
                font-weight: 400;
                letter-spacing: 0.1em;
                line-height: 1.2;
                margin: 0 0 16px 0;
            }

            .footer {
                background-color: #00a77e;
                text-align: center;
                font-size: 16px;
                line-height: 1.45;
                color: #fff;
                padding: 30px 24px;
            }
                .footer a {
                    color: #fff;
                }

            .gutter {
                padding: 0;
            }
            .button {
                background: #fff200;
                border: 3px solid #140958;
                color: #140958 !important;
                display: inline-block;
                border-radius: 0;
                padding: 12px 30px;
                text-align: center;
                text-decoration: none;
                font-family: Bangers, Impact, Arial Black, Arial, sans-serif;
                font-size: 28px;
                font-weight: bold;
                line-height: 1.15;
            }
            .button:hover {
                background: #fff200;
                color: #140958;
            }
            img {
                max-width: 100%;
            }

            a {
                color: #140958;
            }
                a:hover {
                    color: #140958;
                }
            @media screen and (max-width: 600px) {
                .wrap {
                    max-width: none;
                    padding: 24px 16px;
                }
                .gutter {
                    padding: 0;
                }
                .header {
                    padding: 20px 16px;
                }
            }
        </style>
    </head>
<body style="background-color: #00a77e; color: #140958; margin: 0;">
    <div class="header">
        <a href="https://wirmachen.wien" target="_blank" rel="noreferrer">
            <img src="https://newsletter.wirmachen.wien/uploads/assets/images/header-logo.png" alt="#WirMachenWien" />
        </a>
    </div>
    <div class="wrap">
{{ end }}

{{ define "footer" }}
    </div>
    
    <div class="footer">
        <p>Verein Fairkehrswende<br>Lichtenauergasse 4/1/1, 1020 Wien</p>
        <p><a href="mailto:info@wirmachen.wien">info@wirmachen.wien</a></p>
    </div>
</body>
</html>
{{ end }}
